name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high --omit=dev
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Fail if the build contains network calls
        run: |
          if grep -rEl "fetch\(|XMLHttpRequest|WebSocket\(|sendBeacon" dist/assets; then
            echo "Network API found in build output"; exit 1
          fi
